openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Rooms and art objects managed through the admin panel
  - name: placements
    description: Where art objects sit inside rooms
  - name: media
    description: Image files present on disk
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /media:
    get:
      operationId: listMedia
      tags: [media]
      summary: Image files available on disk
      description: >
        Filenames present in the app's public image directories. Images are
        managed by hand through the file browser, so this is read directly
        from the filesystem on every request and needs no code change when a
        file is added.
      responses:
        "200":
          description: Available image filenames
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaLibrary"

  /media/art:
    post:
      operationId: uploadArtImage
      tags: [media]
      summary: Save an art image and its thumbnail
      description: >
        Writes one art image and the thumbnail generated from it into the
        public art directory. The admin panel provides a single file: it scales
        the image down in a canvas and sends both, so there is no image
        processing on the server and no separate thumbnail to manage. The
        server owns the filenames, so the base name is a suggestion that is
        slugified and made unique before anything is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtImageUpload"
      responses:
        "201":
          description: The filenames the images were written under
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtImageFiles"
        "400":
          description: The upload was malformed or too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /art-image/{filename}:
    get:
      operationId: getArtImage
      tags: [media]
      summary: Serve an art image file
      description: >
        Returns the image bytes, checking object storage first (uploads) and
        the seeded filesystem copies second. The SPA's static hosting answers
        every URL with `index.html` and a 200, so it cannot distinguish a
        missing image from a present one; this route genuinely 404s, and
        serves fresh uploads in production without waiting for a rebuild.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: No such art image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /media/rooms:
    post:
      operationId: uploadRoomImage
      tags: [media]
      summary: Save a room photograph
      description: >
        Writes one room photograph into object storage, mirroring the art
        upload route. Rooms have no tray thumbnail, so a single image is sent
        and no scaled copy is generated. The server owns the filename, so the
        base name is a suggestion that is slugified and made unique before
        anything is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomImageUpload"
      responses:
        "201":
          description: The filename the image was written under
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomImageFile"
        "400":
          description: The upload was malformed or too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /room-image/{filename}:
    get:
      operationId: getRoomImage
      tags: [media]
      summary: Serve a room image file
      description: >
        Returns the image bytes, checking object storage first (uploads) and
        the seeded filesystem copies second — the same resolution order as
        art images, and for the same reason: uploads must survive a publish,
        and the SPA's catch-all static route cannot 404 an absent file.
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: No such room image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rooms:
    get:
      operationId: listRooms
      tags: [catalog]
      summary: List rooms
      parameters:
        - name: includeHidden
          in: query
          required: false
          description: Include rooms hidden from the public placement experience. Used by the admin panel.
          schema:
            type: boolean
      responses:
        "200":
          description: Rooms in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
    post:
      operationId: createRoom
      tags: [catalog]
      summary: Create a room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rooms/{roomId}:
    patch:
      operationId: updateRoom
      tags: [catalog]
      summary: Update a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRoom
      tags: [catalog]
      summary: Delete a room and every placement inside it
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: No such room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /art:
    get:
      operationId: listArt
      tags: [catalog]
      summary: List art objects
      responses:
        "200":
          description: The inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtObject"
    post:
      operationId: createArt
      tags: [catalog]
      summary: Create an art object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtObject"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /art/{artId}:
    patch:
      operationId: updateArt
      tags: [catalog]
      summary: Update an art object
      parameters:
        - name: artId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtObject"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such art object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteArt
      tags: [catalog]
      summary: Delete an art object and every placement of it
      parameters:
        - name: artId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: No such art object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /placements:
    get:
      operationId: listPlacements
      tags: [placements]
      summary: Every placement across every room
      responses:
        "200":
          description: Placements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Placement"
    put:
      operationId: replacePlacements
      tags: [placements]
      summary: Replace the whole set of placements
      description: >
        The felt board owns the full set in memory (it supports undo and
        reset), so it writes the whole set back rather than diffing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacementSet"
      responses:
        "200":
          description: The stored placements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Placement"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MediaLibrary:
      type: object
      properties:
        rooms:
          description: Filenames in the public rooms directory
          type: array
          items:
            type: string
        art:
          description: Filenames in the public art directory
          type: array
          items:
            type: string
      required:
        - rooms
        - art

    ArtImageUpload:
      type: object
      properties:
        baseName:
          description: >
            Suggested file stem, usually slugified from the piece's name. The
            server sanitises it and appends a suffix if the name is taken, so
            it can never escape the art directory or overwrite an existing
            image.
          type: string
          minLength: 1
        fullImage:
          description: Data URL of the image as uploaded, at its original size
          type: string
        thumbnail:
          description: Data URL of the tray-sized image generated from it
          type: string
      required:
        - baseName
        - fullImage
        - thumbnail

    ArtImageFiles:
      type: object
      properties:
        fullImageFilename:
          type: string
        thumbnailFilename:
          type: string
        renamedFrom:
          description: >
            Present when the requested name was already taken and the files
            were saved under a suffixed name instead. Holds the name of the
            existing file the upload collided with — which may carry a
            different extension, since names are compared by stem — so the
            client can point at the likely duplicate rather than letting a
            `-2` copy appear silently.
          type: string
      required:
        - fullImageFilename
        - thumbnailFilename

    RoomImageUpload:
      type: object
      properties:
        baseName:
          description: >
            Suggested file stem, usually slugified from the room's name. The
            server sanitises it and appends a suffix if the name is taken, so
            it can never escape the rooms directory or overwrite an existing
            image.
          type: string
          minLength: 1
        image:
          description: Data URL of the room photograph as uploaded
          type: string
      required:
        - baseName
        - image

    RoomImageFile:
      type: object
      properties:
        imageFilename:
          type: string
        renamedFrom:
          description: >
            Present when the requested name was already taken and the file was
            saved under a suffixed name instead. Holds the name of the existing
            file the upload collided with, which may carry a different
            extension: names are compared by stem, so a photograph re-uploaded
            as WebP still collides with the PNG copy of it.
          type: string
      required:
        - imageFilename

    Room:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        imageFilename:
          description: A file in the public rooms directory. 1600x1000px, 16:10.
          type: string
        bandSplit:
          description: >
            Percentage of canvas height. Wall art may only be placed above it,
            sculptures only below it.
          type: number
          minimum: 1
          maximum: 99
        wallWidthFeet:
          description: >
            Real-world width, in decimal feet, of the BACK WALL spanned by the
            full canvas width — measured corner to corner exactly where that
            wall fills the frame. Deliberately not the room's footprint, its
            depth, or anything visible through an archway. Every placed piece
            is scaled against this number, so it is what lets one 48" canvas
            read at the correct size in rooms photographed at different fields
            of view. Set by the calibration tool in the admin panel.
          type: number
          exclusiveMinimum: 0
        referenceLengthFeet:
          description: >
            Real length, in decimal feet, of whatever the reference line was
            laid along to produce `wallWidthFeet` — a door frame, a countertop,
            a headboard. Kept so the calibration tool reopens on the same
            reference the room was actually measured against instead of
            inheriting whatever the previously edited room used.

            Optional: rooms calibrated before this was recorded have no honest
            value for it, and guessing one would assert a measurement nobody
            made. A room absent this field is presented against the standard
            door frame, and gains a stored value the next time it is saved.
          type: number
          exclusiveMinimum: 0
        isVisible:
          description: Whether this room is available in the public placement experience.
          type: boolean
      required:
        - id
        - name
        - imageFilename
        - bandSplit
        - wallWidthFeet

    RoomInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        imageFilename:
          type: string
          minLength: 1
        bandSplit:
          type: number
          minimum: 1
          maximum: 99
        wallWidthFeet:
          description: Real-world back-wall width in decimal feet.
          type: number
          exclusiveMinimum: 0
        referenceLengthFeet:
          description: >
            Real length in decimal feet of the reference the wall width was
            measured against. Required here, unlike on `Room`: the admin panel
            always knows what it measured against, so anything it creates can
            record it.
          type: number
          exclusiveMinimum: 0
        isVisible:
          description: Whether this room is available in the public placement experience.
          type: boolean
      required:
        - name
        - imageFilename
        - bandSplit
        - wallWidthFeet
        - referenceLengthFeet

    RoomUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        imageFilename:
          type: string
          minLength: 1
        bandSplit:
          type: number
          minimum: 1
          maximum: 99
        wallWidthFeet:
          type: number
          exclusiveMinimum: 0
        referenceLengthFeet:
          type: number
          exclusiveMinimum: 0
        isVisible:
          description: Whether this room is available in the public placement experience.
          type: boolean

    ArtObject:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/ObjectType"
        thumbnailFilename:
          type: string
        fullImageFilename:
          type: string
        realWidthInches:
          description: >
            True width of the physical piece, in inches, exactly as an art
            listing would state it. The on-canvas scale is derived from this
            against each room's own back-wall calibration, so it is never
            stored per room.
          type: number
          exclusiveMinimum: 0
        realHeightInches:
          description: True height of the physical piece, in inches.
          type: number
          exclusiveMinimum: 0
        resizeRangePercent:
          description: >
            How far a visitor may size this piece up or down from its
            true-to-life size, as a percentage. 20 means a range of 80%-120%.
          type: number
          minimum: 0
          maximum: 100
      required:
        - id
        - name
        - type
        - thumbnailFilename
        - fullImageFilename
        - realWidthInches
        - realHeightInches
        - resizeRangePercent

    ObjectType:
      type: string
      enum:
        - wall
        - sculpture

    ArtInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/ObjectType"
        thumbnailFilename:
          type: string
          minLength: 1
        fullImageFilename:
          type: string
          minLength: 1
        realWidthInches:
          type: number
          exclusiveMinimum: 0
        realHeightInches:
          type: number
          exclusiveMinimum: 0
        resizeRangePercent:
          type: number
          minimum: 0
          maximum: 100
      required:
        - name
        - type
        - thumbnailFilename
        - fullImageFilename
        - realWidthInches
        - realHeightInches
        - resizeRangePercent

    ArtUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/ObjectType"
        thumbnailFilename:
          type: string
          minLength: 1
        fullImageFilename:
          type: string
          minLength: 1
        realWidthInches:
          type: number
          exclusiveMinimum: 0
        realHeightInches:
          type: number
          exclusiveMinimum: 0
        resizeRangePercent:
          type: number
          minimum: 0
          maximum: 100

    Placement:
      type: object
      properties:
        objectId:
          type: string
        roomId:
          type: string
        x:
          description: Percentage of canvas width, 0-100
          type: number
        y:
          description: Percentage of canvas height, 0-100
          type: number
        scale:
          type: number
          exclusiveMinimum: 0
          maximum: 1
      required:
        - objectId
        - roomId
        - x
        - y
        - scale

    PlacementSet:
      type: array
      items:
        $ref: "#/components/schemas/Placement"
